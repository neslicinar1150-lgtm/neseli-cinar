
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Stretch</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101827;
}

#page {
  position: absolute;
  inset: -100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  background:
    radial-gradient(circle at 30% 30%, #8bb7d3, transparent 45%),
    radial-gradient(circle at 80% 80%, #73528d, transparent 50%),
    linear-gradient(140deg, #263d5b, #101827);
  transform-origin: center;
  will-change: transform;
}

h1 {
  font-size: 70px;
  font-weight: 300;
  letter-spacing: 10px;
}

.card {
  width: 230px;
  height: 300px;
  border-radius: 30px;
  background: linear-gradient(145deg,#d8c9a9,#53647b);
  display: grid;
  place-items: center;
  font-size: 60px;
  box-shadow: 0 20px 60px #0006;
}

p {
  font-size: 18px;
}

button {
  position: fixed;
  z-index: 5;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 24px;
  border: none;
  border-radius: 30px;
  color: white;
  background: #397bc5;
}
</style>
</head>

<body>

<button onclick="startSensors()">Duo Efektini Başlat</button>

<div id="page">
  <h1>DUO</h1>
  <div class="card">9:41</div>
  <p>Dynamic Stretch</p>
</div>

<script>
const page = document.getElementById("page");

let sx = 1, sy = 1;
let tx = 1, ty = 1;
let moveX = 0, moveY = 0;
let targetX = 0, targetY = 0;

function clamp(v,min,max) {
  return Math.max(min,Math.min(max,v));
}

function animate() {
  sx += (tx-sx)*0.12;
  sy += (ty-sy)*0.12;
  moveX += (targetX-moveX)*0.12;
  moveY += (targetY-moveY)*0.12;

  page.style.transform =
    `translate3d(${moveX}px,${moveY}px,0) scale(${sx},${sy})`;

  requestAnimationFrame(animate);
}
animate();


function handleOrientation(e) {
  if (e.gamma === null || e.beta === null) return;

  const x = clamp(e.gamma / 35, -1, 1);
  const y = clamp((e.beta - 45) / 35, -1, 1);

  // Ters yönde uzama
  tx = 1 + Math.abs(x) * 0.20;
  ty = 1 + Math.abs(y) * 0.20;

  // Uzama yönü tersine çevrildi
  const originX = x > 0 ? "right" : "left";
  const originY = y > 0 ? "bottom" : "top";

  page.style.transformOrigin =
    `${originX} ${originY}`;

  targetX = -x * 12;
  targetY = -y * 12;
}


async function startSensors() {
  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    }

    window.addEventListener(
      "deviceorientation",
      handleOrientation
    );
  } catch (err) {
    alert("Sensör erişimi başarısız.");
  }
}
</script>

</body>
</html>
