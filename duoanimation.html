
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Motion</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #080d19;
  color: white;
  font-family: Arial;
}

#page {
  position: absolute;
  inset: -35px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 30% 30%, #234a79, transparent 45%),
    radial-gradient(circle at 75% 75%, #46245f, transparent 45%),
    #080d19;
  will-change: transform;
}

h1 {
  font-size: 45px;
  font-weight: 300;
  letter-spacing: 8px;
}

p {
  font-size: 17px;
  color: #b5c8e9;
}

.glow {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, #75caff, #6545b5, transparent 70%);
  filter: blur(5px);
  margin: 25px;
}

button {
  background: #315c91;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="page">
  <h1>DUO</h1>
  <div class="glow"></div>
  <p>Move your iPhone</p>
  <button onclick="startSensors()">Başlat</button>
</div>

<script>
const page = document.getElementById("page");

let x = 0, y = 0;
let targetX = 0, targetY = 0;

function animate() {
  x += (targetX - x) * 0.09;
  y += (targetY - y) * 0.09;

  page.style.transform =
    `translate3d(${x}px, ${y}px, 0)`;

  requestAnimationFrame(animate);
}

animate();

async function startSensors() {
  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const result =
        await DeviceOrientationEvent.requestPermission();

      if (result !== "granted") return;
    }

    window.addEventListener("deviceorientation", (e) => {
      if (e.gamma === null || e.beta === null) return;

      targetX = Math.max(-35, Math.min(35, e.gamma * 1.5));
      targetY = Math.max(-35, Math.min(35, (e.beta - 45) * 1.2));
    });

  } catch (error) {
    alert("Sensör erişimi sağlanamadı.");
  }
}
</script>

</body>
</html>
