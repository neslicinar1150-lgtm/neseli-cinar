
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Motion Effect</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111827;
  font-family: Arial, sans-serif;
}

#page {
  position: absolute;
  inset: -70px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, #6688a0, transparent 45%),
    radial-gradient(circle at 80% 80%, #80628b, transparent 45%),
    linear-gradient(145deg, #34465c, #111827);
  will-change: transform;
}

h1 {
  font-size: 65px;
  font-weight: 300;
  letter-spacing: 10px;
  color: white;
}

p {
  color: #d8e4f1;
  font-size: 18px;
}

.card {
  width: 240px;
  height: 300px;
  border-radius: 25px;
  background: linear-gradient(145deg, #d7c6a5, #495d76);
  box-shadow: 0 20px 60px #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 35px;
}

#status {
  position: fixed;
  bottom: 25px;
  color: white;
  z-index: 10;
}

button {
  position: fixed;
  top: 20px;
  z-index: 20;
  padding: 14px 24px;
  border: 0;
  border-radius: 30px;
  background: #3879c9;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<button onclick="startSensors()">Duo Efektini Başlat</button>

<div id="page">
  <h1>DUO</h1>
  <div class="card">9:41</div>
  <p>Hareketi hisset.</p>
</div>

<div id="status">Sensör bekleniyor...</div>

<script>
const page = document.getElementById("page");
const statusText = document.getElementById("status");

let currentX = 0;
let targetX = 0;
let currentY = 0;
let targetY = 0;

const maxMove = 65;
const sensitivity = 2;

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

// Yumuşak animasyon
function animate() {
  currentX += (targetX - currentX) * 0.12;
  currentY += (targetY - currentY) * 0.12;

  page.style.transform =
    `translate3d(${currentX}px, ${currentY}px, 0)`;

  requestAnimationFrame(animate);
}

animate();

// Telefon sensörleri
function handleMotion(event) {
  if (event.gamma === null) return;

  // Sola eğilince sayfa sağa gider
  targetX = clamp(
    -event.gamma * sensitivity,
    -maxMove,
    maxMove
  );

  // Öne ve arkaya eğilme
  if (event.beta !== null) {
    targetY = clamp(
      -(event.beta - 45) * 1.5,
      -maxMove,
      maxMove
    );
  }
}

async function startSensors() {
  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {
        statusText.textContent = "Sensör izni verilmedi.";
        return;
      }
    }

    window.addEventListener(
      "deviceorientation",
      handleMotion
    );

    statusText.textContent = "Duo efekti aktif!";
  } catch (error) {
    statusText.textContent =
      "Sensör erişimi başarısız. HTTPS gerekli olabilir.";
  }
}
</script>

</body>
</html>
